version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: warehouse-os-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: warehouse_os
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Node Backend & React Frontend Server
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: warehouse-os-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgres://postgres:postgrespassword@postgres:5432/warehouse_os
      JWT_SECRET: default-warehouse-os-jwt-secret-replace-in-production
    depends_on:
      - postgres

volumes:
  pgdata:
